name: Deploy Bot to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          PATH_SECRET: ${{ secrets.PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: BOT_TOKEN,ADMIN_ID,PATH_SECRET
          script: |
            # Papkani yaratish (agar yo'q bo'lsa) va ichiga kirish
            mkdir -p $PATH_SECRET
            cd $PATH_SECRET || exit 1
            
            # Agar bu yerda oldin git o'rnatilmagan bo'lsa, uni sozlash
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/sardorqarshiyev169-png/KINO-VA-ANIMELAR-OLAMI.git
            fi
            
            # Eski fayllarni e'tiborga olmasdan, Githubdagi 100% yangi kodni tortib olish
            git fetch --all
            git reset --hard origin/main
            
            # .env faylini avtomatik yaratish
            echo "BOT_TOKEN=$BOT_TOKEN" > .env
            echo "ADMIN_ID=$ADMIN_ID" >> .env
            
            # Docker yordamida botni yangilash va ishga tushirish
            docker compose up -d --build
